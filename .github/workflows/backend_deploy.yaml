name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 11.22.0
          run_install: false

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          # 强制把pnpm action路径放最前面，消除版本冲突
          export PATH="${{ steps.pnpm-install.outputs.pnpm-directory }}:$PATH"
          pnpm --version
          
          export use_worker_assets=${{ secrets.USE_WORKER_ASSETS }}
          export use_worker_assets_with_telegram=${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          
          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            pnpm rebuild core-js-pure esbuild workerd
            if [ -n "$use_worker_assets_with_telegram" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi

          export debug_mode=${{ secrets.DEBUG_MODE }}
          export use_mail_wasm_parser=${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          
          cd worker/
          # 修复多行secret写入，避免printf丢失换行
          cat <<< "$WRANGLER_TOML_CONTENT" > wrangler.toml
          # 打印生成的文件，调试用，确认main字段是否存在
          cat wrangler.toml

          # pnpm11动态生成allowBuilds配置文件，彻底绕开环境变量与版本兼容问题
          cat > pnpm-workspace.yaml <<'YAML'
packages:
  - '.'
allowBuilds:
  core-js-pure: true
  esbuild: true
  workerd: true
YAML

          pnpm install --no-frozen-lockfile
          pnpm rebuild core-js-pure esbuild workerd

          if [ -n "$use_mail_wasm_parser" ]; then
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker --allow-build=core-js-pure --allow-build=esbuild --allow-build=workerd
            git apply ../.github/config/mail-parser-wasm-worker.patch
            echo "Applied mail-parser-wasm-worker patch"
          fi

          if [ "$debug_mode" = "true" ]; then
            pnpm run deploy
          else
            if pnpm run deploy; then
              echo "Deploy succeeded"
            else
              code=$?
              echo "Command failed with exit code $code"
              exit "$code"
            fi
          fi
          echo "Deployed for tag ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
